spring.application.name=governance

#spring.datasource.driverClassName=com.mysql.jdbc.driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/govt
spring.datasource.username= root
spring.datasource.password=${DB_PASSWORD:root}

#spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
 
spring.jpa.open-in-view=false
 
# multipart file size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

app.frontend.url=http://localhost:4200
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200}
app.upload.dir=${APP_UPLOAD_DIR:uploads}
citizen.upload.dir=${APP_UPLOAD_DIR:src/main/resources/uploads/}

# EMAIL — Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:sefatmahmud995@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8

# Google Account → Security → 2-Step Verification ON → App Passwords → Generate
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# From address (same as username)
mail.from=${MAIL_FROM:sefatmahmud995@gmail.com}
mail.from.name=E-Governance Municipal Portal

# SMS — SSL Wireless Bangladesh
#sms.ssl.api.url=https://sms.sslwireless.com/pushapi/dynamic/server.php
#sms.ssl.api.token=YOUR_SSL_WIRELESS_API_TOKEN
#sms.ssl.sender.id=YOUR_SENDER_ID

#app.cors.origin=http://localhost:4200
# Production: change to your real domain
# app.cors.origin=https://your-domain.com

# ── JWT Configuration
# Access token: 8 hours (28800000 ms)
jwt.access.expiry-ms=28800000
# Refresh token: 30 days (2592000000 ms)
jwt.refresh.expiry-ms=2592000000
# Change these secrets in production!
jwt.access.secret=${JWT_ACCESS_SECRET:dev-access-secret-change-before-production-123456}
jwt.refresh.secret=${JWT_REFRESH_SECRET:dev-refresh-secret-change-before-production-12345}



# Development only: set OTP_DEV_MODE=true locally if you need the OTP in API responses.
app.otp.dev-mode=${OTP_DEV_MODE:true}
